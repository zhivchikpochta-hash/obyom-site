  <polygon points="305,5 564.81,455 45.19,455" fill="none" stroke-width="1" stroke="grey"/>

  <!-- Этап 1: нижний сегмент строится в системе координат шаблона 610x610. -->
  <!-- Все координаты ниже уже приведены к масштабу 610/660 относительно PNG. -->

  <!-- Команда M: начало контура в верхней левой точке. -->
  <!-- Команда L: верхняя горизонтальная прямая до правой стороны. -->
  <!-- Команда Q: малое скругление верхнего правого перехода. -->
