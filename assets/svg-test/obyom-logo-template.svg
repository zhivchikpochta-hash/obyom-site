  <!-- Команда Q: малое скругление к нижнему правому участку. -->
  <!-- Команда L: прямая к началу большой нижней дуги. -->
  <!-- Команда A: левая половина нижней дуги окружности. -->
  <!-- Команда A: правая половина нижней дуги окружности. -->
  <!-- Команда L: прямая от дуги к нижнему левому переходу. -->
