name: Sync OBYOM runtime

on:
  workflow_dispatch:
    inputs:
      library_ref:
        description: "OBYOM library ref to build"
        required: true
        default: "master"
        type: string

permissions:
  contents: write

concurrency:
  group: sync-obyom-runtime
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check out OBYOM library from GitFlic
        env:
          LIBRARY_REF: ${{ inputs.library_ref }}
        run: |
          git clone --depth 1 --branch "$LIBRARY_REF" \
            https://gitflic.ru/project/3axap777/obyom.git obyom-library

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: obyom-library/package-lock.json

      - name: Install library dependencies
        working-directory: obyom-library
        run: npm ci

      - name: Build OBYOM library
        working-directory: obyom-library
        run: npm run build

      - name: Sync runtime files
        run: ./scripts/sync-obyom-runtime.sh obyom-library/dist

      - name: Apply site runtime compatibility patches
        run: ./scripts/patch-obyom-runtime.sh

      - name: Verify runtime files and paths
        run: |
          test -s bundle.js
          test -s shaders/webgpu/basic.wgsl
          test -s assets/3dmodels/stl/OBYOM_LOGO.stl

          if grep -qE "['\"]/(shaders|assets)/" bundle.js; then
            echo "Found a root-absolute runtime asset path in bundle.js"
            grep -oE "['\"]/(shaders|assets)/[^'\"]+" bundle.js || true
            exit 1
          fi

          grep -q "loadShader('shaders/webgpu/basic.wgsl')" bundle.js
          grep -q "viewer.load('assets/3dmodels/stl/OBYOM_LOGO.stl')" bundle.js

      - name: Commit and push changed runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bundle.js shaders/webgpu/basic.wgsl assets/3dmodels/stl/OBYOM_LOGO.stl

          if git diff --cached --quiet; then
            echo "No runtime changes detected"
            exit 0
          fi

          library_sha="$(git -C obyom-library rev-parse HEAD)"
          git commit -m "chore: sync OBYOM runtime ${library_sha:0:7}"
          git push origin main
