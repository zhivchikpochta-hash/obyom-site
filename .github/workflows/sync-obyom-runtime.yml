name: Sync OBYOM runtime

on:
  workflow_dispatch:
    inputs:
      library_ref:
        description: "OBYOM library ref to build"
        required: true
        default: "master"
        type: string
  repository_dispatch:
    types:
      - obyom-master-updated

permissions:
  contents: write

concurrency:
  group: sync-obyom-runtime
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      LIBRARY_REF: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.library_ref || inputs.library_ref || 'master' }}

    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check out OBYOM library from GitFlic
        env:
          LIBRARY_DIR: ${{ runner.temp }}/obyom-library
        run: |
          rm -rf "$LIBRARY_DIR"
          git clone --depth 1 --branch "$LIBRARY_REF" \
            https://gitflic.ru/project/3axap777/obyom.git "$LIBRARY_DIR"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # The library is cloned outside the site checkout. setup-node's
          # npm cache resolver cannot resolve a cache dependency path outside
          # the workspace, so keep dependency caching disabled here.

      - name: Install library dependencies
        working-directory: ${{ runner.temp }}/obyom-library
        run: npm ci

      - name: Build OBYOM library
        working-directory: ${{ runner.temp }}/obyom-library
        run: npm run build

      - name: Read library revision
        id: library-revision
        working-directory: ${{ runner.temp }}/obyom-library
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:12}" >> "$GITHUB_OUTPUT"

      - name: Sync runtime files
        env:
          LIBRARY_DIST: ${{ runner.temp }}/obyom-library/dist
          RUNTIME_VERSION: ${{ steps.library-revision.outputs.short_sha }}
        run: ./scripts/sync-obyom-runtime.sh "$LIBRARY_DIST" "$RUNTIME_VERSION"

      - name: Apply site runtime compatibility patches
        env:
          BUNDLE_PATH: bundle-${{ steps.library-revision.outputs.short_sha }}.js
          SHADER_PATH: basic-${{ steps.library-revision.outputs.short_sha }}.wgsl
          MODEL_PATH: OBYOM_LOGO-${{ steps.library-revision.outputs.short_sha }}.stl
        run: ./scripts/patch-obyom-runtime.sh

      - name: Update runtime script filename
        env:
          BUNDLE_NAME: bundle-${{ steps.library-revision.outputs.short_sha }}.js
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("script.js")
          text = path.read_text()
          bundle_name = os.environ["BUNDLE_NAME"]
          text, count = re.subn(
              r"script\.src = 'bundle(?:-[^']+)?\.js'",
              f"script.src = '{bundle_name}'",
              text,
          )
          if count != 1:
              raise SystemExit(f"Expected exactly one bundle reference, found {count}")
          path.write_text(text)
          PY

      - name: Verify runtime files and paths
        env:
          BUNDLE_PATH: bundle-${{ steps.library-revision.outputs.short_sha }}.js
          SHADER_PATH: basic-${{ steps.library-revision.outputs.short_sha }}.wgsl
          MODEL_PATH: OBYOM_LOGO-${{ steps.library-revision.outputs.short_sha }}.stl
        run: |
          test -s "$BUNDLE_PATH"
          test -s "shaders/webgpu/$SHADER_PATH"
          test -s "assets/3dmodels/stl/$MODEL_PATH"
          node --check "$BUNDLE_PATH"

          if grep -qE "['\"]/(shaders|assets)/" "$BUNDLE_PATH"; then
            echo "Found a root-absolute runtime asset path in $BUNDLE_PATH"
            grep -oE "['\"]/(shaders|assets)/[^'\"]+" "$BUNDLE_PATH" || true
            exit 1
          fi

          grep -Fq "loadShader('shaders/webgpu/$SHADER_PATH')" "$BUNDLE_PATH"
          grep -Fq "viewer.load('assets/3dmodels/stl/$MODEL_PATH')" "$BUNDLE_PATH"
          grep -Fq "script.src = '$BUNDLE_PATH'" script.js

      - name: Commit and push changed runtime
        env:
          LIBRARY_SHA: ${{ steps.library-revision.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage the generated runtime allowlist, including deletions of old
          # cache-busted files. The sync script has already removed all stale
          # versions from the working tree.
          git add -A -- \
            script.js \
            bundle-*.js \
            shaders/webgpu/basic-*.wgsl \
            assets/3dmodels/stl/OBYOM_LOGO-*.stl

          if git diff --cached --quiet; then
            echo "No runtime changes detected"
            exit 0
          fi

          git commit -m "chore: sync OBYOM runtime ${LIBRARY_SHA:0:7}"
          git push origin main
