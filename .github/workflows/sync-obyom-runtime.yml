name: Build site with OBYOM from GitFlic

on:
  workflow_dispatch:
    inputs:
      library_ref:
        description: "OBYOM GitFlic ref to install"
        required: true
        default: "master"
        type: string
  repository_dispatch:
    types:
      - obyom-master-updated

permissions:
  contents: write

concurrency:
  group: build-site-with-obyom
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LIBRARY_REF: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.library_ref || inputs.library_ref || 'master' }}

    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set OBYOM GitFlic dependency ref
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(path, 'utf8'));
          packageJson.dependencies.obyom = `git+https://gitflic.ru/project/3axap777/obyom.git#${process.env.LIBRARY_REF}`;
          fs.writeFileSync(path, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

      - name: Install site dependencies from GitFlic
        run: npm install

      - name: Read installed OBYOM revision
        id: library-revision
        run: |
          resolved="$(node -p "require('./package-lock.json').packages['node_modules/obyom'].resolved")"
          sha="${resolved##*#}"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not determine installed OBYOM commit: $resolved" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:12}" >> "$GITHUB_OUTPUT"

      - name: Build site
        run: npm run build

      - name: Apply cache-busted runtime names
        env:
          RUNTIME_VERSION: ${{ steps.library-revision.outputs.short_sha }}
        run: |
          bundle_name="site-${RUNTIME_VERSION}.js"
          shader_name="basic-${RUNTIME_VERSION}.wgsl"
          mv site.js "$bundle_name"
          mv shaders/webgpu/basic.wgsl "shaders/webgpu/$shader_name"
          python3 - <<'PY'
          from pathlib import Path
          import os
          version = os.environ['RUNTIME_VERSION']
          path = Path(f'site-{version}.js')
          text = path.read_text()
          text = text.replace('/shaders/webgpu/basic.wgsl', f'shaders/webgpu/basic-{version}.wgsl')
          text = text.replace('shaders/webgpu/basic.wgsl', f'shaders/webgpu/basic-{version}.wgsl')
          path.write_text(text)
          PY
          find . -maxdepth 1 -type f -name 'site-*.js' ! -name "$bundle_name" -delete
          find shaders/webgpu -maxdepth 1 -type f -name 'basic-*.wgsl' ! -name "$shader_name" -delete
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          path = Path('index.html')
          text, count = re.subn(r'<script src="site(?:-[^"]+)?\.js"></script>', f'<script src="site-{os.environ["RUNTIME_VERSION"]}.js"></script>', path.read_text())
          if count != 1:
              raise SystemExit(f'Expected one site script tag, found {count}')
          path.write_text(text)
          PY

      - name: Verify real library integration
        env:
          RUNTIME_VERSION: ${{ steps.library-revision.outputs.short_sha }}
        run: |
          test -s "site-${RUNTIME_VERSION}.js"
          test -s "shaders/webgpu/basic-${RUNTIME_VERSION}.wgsl"
          test -s "assets/3dmodels/stl/EDF+Rotor.stl"
          node --check "site-${RUNTIME_VERSION}.js"
          grep -Fq 'new OBYOM' "site-${RUNTIME_VERSION}.js"
          grep -Fq 'assets/3dmodels/stl/EDF+Rotor.stl' "site-${RUNTIME_VERSION}.js"
          grep -Fq "script src=\"site-${RUNTIME_VERSION}.js\"" index.html

      - name: Remove obsolete runtime artifacts
        run: |
          rm -f script.js bundle.js site.js shaders/webgpu/basic.wgsl
          find . -maxdepth 1 -type f -name 'bundle-*.js' -delete
          test "$(find . -maxdepth 1 -type f -name 'site-*.js' | wc -l)" -eq 1
          test "$(find shaders/webgpu -maxdepth 1 -type f -name 'basic-*.wgsl' | wc -l)" -eq 1

      - name: Commit and push built site
        env:
          LIBRARY_REF: ${{ env.LIBRARY_REF }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .

          if git diff --cached --quiet; then
            echo "No site changes detected"
            exit 0
          fi

          git commit -m "chore: build site with OBYOM ${LIBRARY_REF}"
          git push origin main
