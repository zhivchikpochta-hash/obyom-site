<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow, noarchive">
  <title>OBYOM SVG contour test</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: #101217; color: #f4f6f8; font: 15px/1.5 system-ui, sans-serif; }
    main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 36px 0 60px; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 52px); letter-spacing: -.04em; }
    p { margin: 0 0 28px; color: #aeb7c5; }
    .comparison { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    figure { margin: 0; padding: 14px; border: 1px solid #29313d; border-radius: 12px; background: #171c25; }
    figcaption { margin: 0 0 12px; color: #ff8542; font-size: 12px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    .artboard { display: grid; place-items: center; aspect-ratio: 1; overflow: hidden; border-radius: 8px; background: #e8e6e2; }
    .artboard img, .artboard object { display: block; width: 100%; height: 100%; object-fit: contain; }
    .overlay { position: relative; }
    .overlay img, .overlay object { grid-area: 1 / 1; }
    .overlay object { opacity: .5; mix-blend-mode: multiply; }
    .note { margin-top: 24px; padding: 14px 16px; border-left: 3px solid #f26a21; background: #171c25; color: #aeb7c5; }
    @media (max-width: 720px) { .comparison { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main>
    <h1>SVG contour test</h1>
    <p>Private visual test page. Not linked from the site navigation and excluded from search indexing.</p>
    <section class="comparison" aria-label="SVG and logo comparison">
      <figure><figcaption>Logo reference</figcaption><div class="artboard"><img src="assets/svg-test/logo.png" alt="Logo reference"></div></figure>
      <figure><figcaption>Template overlay</figcaption><div class="artboard overlay"><img src="assets/svg-test/logo.png" alt="Logo reference"><object data="assets/svg-test/obyom-logo-template.svg" type="image/svg+xml" aria-label="SVG template overlay"></object></div></figure>
      <figure><figcaption>Contour overlay</figcaption><div class="artboard overlay"><img src="assets/svg-test/logo.png" alt="Logo reference"><object data="assets/svg-test/obyom-contour.svg" type="image/svg+xml" aria-label="SVG contour overlay"></object></div></figure>
    </section>
    <div class="note">PNG используется только как подложка на этой тестовой странице. Финальный контур построен из одного базового сегмента с поворотами 120° и 240°.</div>
  </main>
</body>
</html>
